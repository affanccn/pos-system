workflows:
  android-release:
    name: Android Release

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          cd pos_mobile
          flutter pub get

      - name: Build Android APK
        script: |
          cd pos_mobile
          flutter build apk --release

    artifacts:
      - pos_mobile/build/app/outputs/flutter-apk/app-release.apk